name: Actualitza setmanes.json
on:
  push:
    paths:
      - "setmanes/**"
      - "generar.js"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  genera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save sharp
      - run: node generar.js
      - name: Desa els canvis
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A setmanes.json setmanes
          git diff --staged --quiet || (git commit -m "Actualitza setmanes.json" && git push)
