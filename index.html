<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El nostre curs 2026-2027 · Júlia i Erica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef4f1; --grid:#d3e3de; --ink:#3d4b5c; --ink-soft:#6b7a8a;
  --pink:#f4a9a3; --mint:#a9dccb; --sun:#f7dc82; --lilac:#cdbbea;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --body:"Patrick Hand","Segoe Print","Comic Sans MS",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; color:var(--ink); font:1.15rem/1.5 var(--body);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
}
body.locked main{display:none}

/* ---------- contrasenya ---------- */
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:1rem;background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
body:not(.locked) #gate{display:none}
.gate-card{position:relative;background:#fff;padding:2.2rem 2rem 1.6rem;max-width:22rem;width:100%;text-align:center;
  box-shadow:0 6px 18px rgba(61,75,92,.18);transform:rotate(-1.5deg)}
.gate-card h1{font:700 2.2rem/1.1 var(--hand);margin:0 0 .3rem}
.gate-card p{margin:0 0 1rem;color:var(--ink-soft)}
.gate-card input{width:100%;font:inherit;padding:.5rem .7rem;border:2px dashed var(--mint);border-radius:6px;background:#fbfffd;color:var(--ink);text-align:center}
.gate-card input:focus-visible,.gate-card button:focus-visible,.polaroid:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}
.gate-card button{margin-top:.8rem;font:700 1.4rem var(--hand);padding:.2rem 1.4rem;border:0;border-radius:6px;background:var(--pink);color:#4a2e2c;cursor:pointer}
#gate-err{min-height:1.4em;margin:.6rem 0 0;color:#b4534b;font-size:1rem}

/* ---------- washi ---------- */
.tape{position:absolute;width:5.5rem;height:1.7rem;opacity:.88;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 6px,transparent 6px 12px),var(--tc,var(--pink));
  box-shadow:0 1px 2px rgba(0,0,0,.12)}
.gate-card .tape{top:-.8rem;left:50%;margin-left:-2.75rem;transform:rotate(-3deg)}

/* ---------- capçalera ---------- */
header{text-align:center;padding:3.5rem 1rem 2rem}
.title-card{position:relative;display:inline-block;background:#fff;padding:1.6rem 2.6rem 1.3rem;transform:rotate(-1.2deg);
  box-shadow:0 6px 18px rgba(61,75,92,.18)}
.title-card .tape{top:-.9rem;left:-1.8rem;transform:rotate(-32deg);--tc:var(--sun)}
.title-card .tape.b{left:auto;right:-1.8rem;top:auto;bottom:-.6rem;transform:rotate(-32deg);--tc:var(--mint)}
h1.main{margin:0;font:700 clamp(2.6rem,9vw,4.8rem)/1 var(--hand)}
.team{margin:.4rem 0 0;font:500 1.7rem var(--hand);color:var(--ink-soft)}
.lead{max-width:30rem;margin:1.6rem auto 0;color:var(--ink-soft)}

/* ---------- línia del temps ---------- */
.timeline{position:relative;max-width:1040px;margin:0 auto;padding:1rem 1rem 5rem}
.timeline::before{content:"";position:absolute;top:0;bottom:2rem;left:50%;border-left:4px dashed var(--pink);transform:translateX(-50%)}
.mes{position:relative;text-align:center;margin:2.6rem 0 1.2rem;z-index:1}
.mes span{display:inline-block;padding:.1rem 1.5rem;font:700 2.2rem/1.3 var(--hand);color:#3f3560;background:var(--lilac);
  border-radius:4px;transform:rotate(-2deg);box-shadow:0 3px 8px rgba(61,75,92,.18)}
.setmana{position:relative;display:flex;justify-content:flex-start;margin:0 0 3.2rem}
.setmana:nth-of-type(even){justify-content:flex-end}
.dot{position:absolute;left:50%;top:1rem;width:2.8rem;height:2.8rem;margin-left:-1.4rem;border-radius:50%;z-index:1;
  display:grid;place-items:center;background:var(--sun);border:3px solid #fff;font:700 1.35rem var(--hand);box-shadow:0 2px 6px rgba(61,75,92,.25)}
.contingut{width:calc(50% - 2.4rem)}
.dates{margin:0 0 .5rem;font:700 1.5rem var(--hand);color:var(--ink-soft)}
.nota{position:relative;background:#fffef9;padding:1.2rem 1.2rem 1rem 2.6rem;box-shadow:0 4px 12px rgba(61,75,92,.15);transform:rotate(.6deg);
  background-image:repeating-linear-gradient(transparent 0 1.55rem,#cfe3ee 1.55rem calc(1.55rem + 1px));background-position:0 .6rem}
.nota::after{content:"";position:absolute;left:1.9rem;top:0;bottom:0;border-left:2px solid #f2b7b2}
.nota .tape{top:-.8rem;right:1.5rem;transform:rotate(4deg);--tc:var(--mint)}
.nota h2{margin:0 0 .2rem;font:700 1.9rem/1.15 var(--hand)}
.nota p{margin:0;line-height:1.55rem}

/* ---------- polaroids ---------- */
.fotos{display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem;margin-top:1.4rem}
.polaroid{position:relative;flex:1 1 9rem;max-width:12.5rem;margin:0;padding:.55rem .55rem .4rem;background:#fff;border:0;cursor:zoom-in;
  font:inherit;color:inherit;text-align:center;box-shadow:0 5px 14px rgba(61,75,92,.22);transition:transform .2s ease}
.polaroid img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#e6ece9}
.polaroid span{display:block;padding:.35rem 0 .1rem;font:500 1.3rem/1.1 var(--hand)}
.polaroid::before{content:"";position:absolute;top:-.7rem;left:50%;width:3.6rem;height:1.3rem;margin-left:-1.8rem;transform:rotate(var(--tr,-4deg));opacity:.9;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 5px,transparent 5px 10px),var(--tc,var(--pink))}
.polaroid:nth-child(3n+1){transform:rotate(-4deg)}
.polaroid:nth-child(3n+2){transform:rotate(3deg) translateY(.5rem);--tc:var(--sun);--tr:5deg}
.polaroid:nth-child(3n){transform:rotate(-2deg);--tc:var(--mint)}
.polaroid:hover{transform:rotate(0) scale(1.05);z-index:2}

.final{position:relative;z-index:1;text-align:center;margin-top:1rem}
.final span{display:inline-block;padding:.5rem 1.4rem;background:var(--sun);font:700 1.8rem var(--hand);transform:rotate(2deg);box-shadow:0 3px 8px rgba(61,75,92,.18)}

/* ---------- ampliar foto ---------- */
#zoom{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:1rem;background:rgba(61,75,92,.78);cursor:zoom-out}
#zoom.on{display:grid}
#zoom figure{margin:0;background:#fff;padding:.8rem .8rem .5rem;max-width:min(92vw,900px);transform:rotate(-1deg)}
#zoom img{display:block;max-width:100%;max-height:76vh}
#zoom figcaption{text-align:center;font:500 1.6rem var(--hand);padding-top:.3rem}

/* ---------- mòbil ---------- */
@media (max-width:720px){
  .timeline::before{left:1.9rem;transform:none}
  .mes{text-align:left;padding-left:3.6rem}
  .setmana,.setmana:nth-of-type(even){justify-content:flex-end}
  .dot{left:1.9rem}
  .contingut{width:calc(100% - 4rem)}
  .final{text-align:left;padding-left:3.6rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body class="locked">

<!-- CONTRASENYA -->
<div id="gate">
  <div class="gate-card">
    <div class="tape"></div>
    <h1>Només per a nosaltres</h1>
    <p>Escriu la contrasenya per entrar.</p>
    <input id="pw" type="password" autocomplete="off" aria-label="Contrasenya">
    <button id="enter" type="button">Entrar</button>
    <p id="gate-err" role="alert"></p>
  </div>
</div>

<main>
  <header>
    <div class="title-card">
      <div class="tape"></div><div class="tape b"></div>
      <h1 class="main">El nostre curs</h1>
      <p class="team">2026–2027 · Júlia i Erica · juliquers</p>
    </div>
    <p class="lead">Tot el que hem fet, setmana a setmana: plans, riures i fotos.</p>
  </header>

  <section class="timeline" id="timeline" aria-label="Setmanes del curs"></section>
</main>

<div id="zoom" role="dialog" aria-label="Foto ampliada"><figure><img alt=""><figcaption></figcaption></figure></div>

<script>
/* =====================================================
   1) CONTRASENYA
   Per canviar-la: genera el SHA-256 de la teva paraula nova
   (per ex. a https://emn178.github.io/online-tools/sha256.html)
   i enganxa'l aquí sota. Ara mateix és: juliquers
   ===================================================== */
const HASH = "a37336662829cc50922b40b2ee6ee2fa3bd49d5d97b2699a4be9527034278be9";

/* =====================================================
   2) SETMANES — afegeix un bloc nou cada setmana
   inici: el DILLUNS de la setmana (any-mes-dia)
   fotos: ruta de la foto + peu (el text sota la polaroid)
   ===================================================== */
const SETMANES = [
  {
    inici: "2026-10-26",
    titol: "Setmana de Halloween",
    text: "Poble ple de banderoles, diademes de carbassa, un home llop pel carrer i hamburguesa amb nachos per recuperar forces.",
    fotos: [
      { src: "fotos/2026-10/1.jpg", peu: "Boo! 🎃" },
      { src: "fotos/2026-10/2.jpg", peu: "Uuuh, un home llop!" },
      { src: "fotos/2026-10/3.jpg", peu: "Recuperant forces" }
    ]
  }
  /* ,{ inici: "2026-11-02", titol: "...", text: "...", fotos: [ {src:"fotos/2026-11-02/1.jpg", peu:"..."} ] } */
];

/* ---------- a partir d'aquí no cal tocar res ---------- */
const MESOS = ["Gener","Febrer","Març","Abril","Maig","Juny","Juliol","Agost","Setembre","Octubre","Novembre","Desembre"];
const DE = ["de gener","de febrer","de març","d’abril","de maig","de juny","de juliol","d’agost","de setembre","d’octubre","de novembre","de desembre"];
const IniciCurs = Date.UTC(2026, 7, 31); // dilluns de la primera setmana
const DIA = 864e5;

function parse(s){ const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y, m-1, d)); }
function rang(ini){
  const a = ini, b = new Date(+ini + 6*DIA);
  const da = a.getUTCDate(), db = b.getUTCDate(), ma = a.getUTCMonth(), mb = b.getUTCMonth();
  return ma === mb ? `${da}–${db} ${DE[ma]}` : `${da} ${DE[ma]} – ${db} ${DE[mb]}`;
}
function el(tag, cls, html){ const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.textContent = html; return e; }

function pinta(){
  const tl = document.getElementById("timeline");
  const ordenades = [...SETMANES].sort((x,y) => x.inici.localeCompare(y.inici));
  let mesActual = "";
  ordenades.forEach(s => {
    const ini = parse(s.inici);
    const clau = ini.getUTCFullYear() + "-" + ini.getUTCMonth();
    if (clau !== mesActual){
      mesActual = clau;
      const m = el("div", "mes"); m.appendChild(el("span", "", `${MESOS[ini.getUTCMonth()]} ${ini.getUTCFullYear()}`));
      tl.appendChild(m);
    }
    const num = Math.floor((+ini - IniciCurs) / (7*DIA)) + 1;
    const w = el("article", "setmana");
    w.appendChild(el("div", "dot", num));
    const c = el("div", "contingut");
    c.appendChild(el("p", "dates", rang(ini)));
    const nota = el("div", "nota");
    nota.appendChild(el("div", "tape"));
    nota.appendChild(el("h2", "", s.titol));
    nota.appendChild(el("p", "", s.text));
    c.appendChild(nota);
    const f = el("div", "fotos");
    (s.fotos || []).forEach(p => {
      const b = el("button", "polaroid"); b.type = "button";
      const i = document.createElement("img"); i.src = p.src; i.alt = p.peu || s.titol; i.loading = "lazy";
      b.appendChild(i); b.appendChild(el("span", "", p.peu || ""));
      b.addEventListener("click", () => obre(p));
      f.appendChild(b);
    });
    c.appendChild(f);
    w.appendChild(c);
    tl.appendChild(w);
  });
  const fi = el("div", "final"); fi.appendChild(el("span", "", "Continuarà… ✏️"));
  tl.appendChild(fi);
}

/* ampliar foto */
const zoom = document.getElementById("zoom");
function obre(p){
  zoom.querySelector("img").src = p.src; zoom.querySelector("img").alt = p.peu || "";
  zoom.querySelector("figcaption").textContent = p.peu || "";
  zoom.classList.add("on");
}
zoom.addEventListener("click", () => zoom.classList.remove("on"));
document.addEventListener("keydown", e => { if (e.key === "Escape") zoom.classList.remove("on"); });

/* entrada amb contrasenya */
async function sha(t){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
function entra(){ document.body.classList.remove("locked"); pinta(); }
async function prova(){
  const err = document.getElementById("gate-err");
  try{
    if (await sha(document.getElementById("pw").value.trim().toLowerCase()) === HASH){
      try{ sessionStorage.setItem("ok", "1"); }catch(e){}
      entra();
    } else err.textContent = "Contrasenya incorrecta, torna-ho a provar.";
  }catch(e){ err.textContent = "El navegador no pot comprovar la contrasenya aquí."; }
}
document.getElementById("enter").addEventListener("click", prova);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") prova(); });
try{ if (sessionStorage.getItem("ok") === "1") entra(); }catch(e){}
</script>
</body>
</html>
